<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenLedger AI — SEBI BRSR Compliance</title>

    <!-- Preconnect to Google Fonts CDN — cuts ~300ms off the initial font fetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <!-- &display=block tells the browser to render the icon span as invisible
         (instead of showing the raw text "grid_view" / "logout" / etc.) until
         the Material Symbols font finishes downloading. Combined with the
         preconnect above, this eliminates the unstyled-icon flash on refresh. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet"/>

    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        /* Hide the literal ligature text until the icon font has loaded.
           Once the @font-face rule kicks in, browsers replace the text with
           the actual glyph and the visibility flips to visible automatically
           because the font's content overrides the parent span. As a hard
           fallback, .fonts-loaded on <html> (set in main.jsx) un-hides them. */
        font-feature-settings: 'liga';
        text-rendering: optimizeLegibility;
      }
      /* Until the font is confirmed loaded, blank out the ligature text so
         users never see "grid_view" / "verified_user" raw strings. */
      html:not(.fonts-loaded) .material-symbols-outlined {
        visibility: hidden;
      }
      body { font-family: 'Inter', sans-serif; background-color: #050505; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
