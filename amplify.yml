version: 1
applications:
  - appRoot: greenledger-ai/frontend
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Node $(node -v) | npm $(npm -v)"
            - npm ci
        build:
          commands:
            - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
